<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">Claritymaxx. Understand difficult things.</title>
  <desc id="desc">Three numbered parts have tangled connections on the left. On the right, the same parts and directed connections form a clear model: one leads to two, two leads to three, and one also leads directly to three.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M2 1 L9 5 L2 9" fill="none" stroke="#555c59" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="accent-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 1 L9 5 L2 9" fill="none" stroke="#287563" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Opaque canvas and quiet frame. -->
  <rect x="1" y="1" width="1278" height="398" rx="18" fill="#f5f3ed" stroke="#cecfc7" stroke-width="2"/>

  <!-- The same three relationships, difficult to trace. -->
  <g fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M144 110 C210 110 178 224 250 224 C333 224 204 76 278 76 C340 76 353 130 320 146" stroke="#287563" marker-end="url(#accent-arrow)"/>
    <path d="M320 182 C367 238 454 222 416 151 C383 90 362 60 430 60 C454 60 466 63 466 86" stroke="#555c59" marker-end="url(#arrow)"/>
    <path d="M112 134 C84 201 151 241 194 177 C225 131 389 168 434 122" stroke="#555c59" marker-end="url(#arrow)"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" text-anchor="middle" fill="#262e2a" stroke-width="1.5">
    <rect x="80" y="86" width="64" height="48" rx="7" fill="#f5f3ed" stroke="#555c59"/>
    <text x="112" y="117">01</text>
    <rect x="288" y="146" width="64" height="48" rx="7" fill="#e0ebe4" stroke="#287563"/>
    <text x="320" y="177">02</text>
    <rect x="434" y="86" width="64" height="48" rx="7" fill="#f5f3ed" stroke="#555c59"/>
    <text x="466" y="117">03</text>
  </g>

  <!-- Reorganize the model without dropping a connection. -->
  <path d="M586 145 H674 M664 135 L674 145 L664 155" fill="none" stroke="#a0a69e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M826 145 H926" stroke="#287563" marker-end="url(#accent-arrow)"/>
    <path d="M990 145 H1090" stroke="#555c59" marker-end="url(#arrow)"/>
    <path d="M794 121 V77 Q794 65 806 65 H1110 Q1122 65 1122 77 V121" stroke="#555c59" marker-end="url(#arrow)"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" text-anchor="middle" fill="#262e2a" stroke-width="1.5">
    <rect x="762" y="121" width="64" height="48" rx="7" fill="#f5f3ed" stroke="#555c59"/>
    <text x="794" y="152">01</text>
    <rect x="926" y="121" width="64" height="48" rx="7" fill="#e0ebe4" stroke="#287563"/>
    <text x="958" y="152">02</text>
    <rect x="1090" y="121" width="64" height="48" rx="7" fill="#f5f3ed" stroke="#555c59"/>
    <text x="1122" y="152">03</text>
  </g>

  <!-- Editorial wordmark, large enough for a narrow README. -->
  <path d="M64 266 H1216" stroke="#d8d9d1" stroke-width="1"/>
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="60" y="348" font-size="82" font-weight="700" letter-spacing="-3" fill="#262e2a">Claritymaxx</text>
    <text x="1216" y="334" text-anchor="end" font-size="28" fill="#555c59">Understand difficult things.</text>
  </g>
</svg>
